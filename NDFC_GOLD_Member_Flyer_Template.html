<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NDFC Gold Member Flyer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

:root{
  --red:#D0021B;
  --red-dark:#94010F;
  --blue:#12169C;
  --blue-dark:#0A0C63;
  --blue-pale:#EEF0FA;
  --white:#FFFFFF;
  --cream:#FBFAF6;
  --ink:#14141C;
  --ink-soft:rgba(20,20,28,0.62);
  --line:rgba(20,20,28,0.12);

  --font-display:'Anton','Arial Narrow',sans-serif;
  --font-body:'Manrope',-apple-system,sans-serif;
  --font-accent:'Space Grotesk','Manrope',sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  background:#1a1a1a;
}

/* =========================================================
   FOLDER / MEMBER SELECTOR
   ========================================================= */

#setupScreen{
  position:fixed;
  inset:0;
  z-index:1000;
  background:
    radial-gradient(circle at top, rgba(18,22,156,.25), transparent 45%),
    #111;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:var(--font-body);
}

.setup-card{
  width:620px;
  max-width:90vw;
  padding:50px 45px;
  background:white;
  text-align:center;
  border-radius:10px;
  box-shadow:0 30px 80px rgba(0,0,0,.4);
}

.setup-logo{
  width:100px;
  height:auto;
  margin-bottom:25px;
}

.setup-card h1{
  font-family:var(--font-display);
  font-size:48px;
  text-transform:uppercase;
  color:var(--blue);
  line-height:1;
}

.setup-card h1 span{
  color:var(--red);
}

.setup-subtitle{
  margin-top:14px;
  color:#555;
  font-size:16px;
  line-height:1.5;
}

.setup-button{
  margin-top:30px;
  width:100%;
  padding:17px 20px;
  border:none;
  border-radius:5px;
  background:var(--blue);
  color:white;
  font-family:var(--font-accent);
  font-weight:700;
  font-size:17px;
  letter-spacing:1px;
  cursor:pointer;
  transition:.2s;
}

.setup-button:hover{
  background:var(--red);
}

.folder-status{
  margin-top:15px;
  font-size:13px;
  color:#777;
}

.member-search{
  display:none;
  margin-top:30px;
}

.member-search label{
  display:block;
  text-align:left;
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:8px;
  color:#555;
}

.member-search-row{
  display:flex;
  gap:10px;
}

.member-search input{
  flex:1;
  min-width:0;
  padding:16px;
  border:1px solid #ccc;
  border-radius:5px;
  font-family:var(--font-body);
  font-size:16px;
  outline:none;
}

.member-search input:focus{
  border-color:var(--blue);
}

.generate-button{
  padding:0 22px;
  border:none;
  border-radius:5px;
  background:var(--red);
  color:white;
  font-family:var(--font-accent);
  font-weight:700;
  cursor:pointer;
}

.generate-button:hover{
  background:var(--blue);
}

.error-message{
  display:none;
  margin-top:15px;
  padding:12px;
  background:#fff0f2;
  border-left:4px solid var(--red);
  color:var(--red-dark);
  text-align:left;
  font-size:14px;
  line-height:1.45;
}

/* =========================================================
   CANVAS
   ========================================================= */

.canvas{
  position:relative;
  width:1080px;
  height:1920px;
  overflow:hidden;
  background:var(--cream);
  font-family:var(--font-body);
  color:var(--ink);
  margin:0 auto;
  display:flex;
  flex-direction:column;
}

.pitch-texture{
  position:absolute;
  inset:0;

  background-image:repeating-linear-gradient(
    -35deg,
    rgba(18,22,156,0.025) 0px,
    rgba(18,22,156,0.025) 60px,
    transparent 60px,
    transparent 120px
  );

  pointer-events:none;
}

.wash-top{
  position:absolute;
  top:-220px;
  left:50%;
  transform:translateX(-50%);
  width:1400px;
  height:640px;

  background:radial-gradient(
    ellipse at center,
    rgba(208,2,27,0.10) 0%,
    transparent 70%
  );

  pointer-events:none;
}

.wash-bottom{
  position:absolute;
  bottom:-260px;
  left:50%;
  transform:translateX(-50%);
  width:1400px;
  height:700px;

  background:radial-gradient(
    ellipse at center,
    rgba(18,22,156,0.10) 0%,
    transparent 70%
  );

  pointer-events:none;
}

.confetti-layer{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
  position:relative;
  z-index:3;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding-top:56px;
}

.logo{
  width:112px;
  height:auto;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.18));
}

.club-name{
  margin-top:16px;

  font-family:var(--font-accent);
  font-weight:700;
  font-size:19px;
  letter-spacing:5px;

  color:var(--blue);
  text-transform:uppercase;
}

.club-sub{
  margin-top:5px;

  font-family:var(--font-accent);
  font-weight:500;
  font-size:12px;
  letter-spacing:2.5px;

  color:var(--ink-soft);
  text-transform:uppercase;
}

/* =========================================================
   HEADLINE
   ========================================================= */

.headline-zone{
  position:relative;
  z-index:3;

  text-align:center;

  padding:40px 64px 0;
}

#memberNameEl{
  font-family:var(--font-display);
  font-weight:400;

  text-transform:uppercase;
  letter-spacing:1px;
  line-height:.96;

  color:var(--blue);

  font-size:108px;
  white-space:nowrap;
}

#memberNameEl .accent{
  color:var(--red);
}

.headline-sub{
  margin-top:14px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
}

.headline-sub .rule{
  height:3px;
  width:44px;
  background:var(--red);
}

.headline-sub span{
  font-family:var(--font-accent);
  font-weight:700;
  font-size:24px;
  letter-spacing:4px;

  color:var(--ink);
  text-transform:uppercase;
  white-space:nowrap;
}

.headline-sub span .gold-word{
  color:#D4AF37;
  font-weight:800;
  font-size:35px;
  font-family:'Cinzel',serif;
}

/* =========================================================
   PHOTO
   ========================================================= */

.photo-zone{
  position:relative;
  z-index:3;

  margin:46px auto 0;

  width:860px;
  height:940px;
}

.photo-mat{
  position:absolute;
  inset:0;

  background:var(--white);
  padding:22px;

  box-shadow:0 24px 50px -12px rgba(10,12,40,.28);
}

.photo-clip{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  background:var(--blue-pale);
}

.photo-clip img{
  width:100%;
  height:100%;

  object-fit:cover;
  display:block;
}

.photo-clip::after{
  content:"";

  position:absolute;
  left:0;
  right:0;
  bottom:0;

  height:26%;

  background:linear-gradient(
    0deg,
    rgba(10,12,40,.35) 0%,
    rgba(10,12,40,0) 100%
  );
}

.frame-overlay{
  position:absolute;
  inset:-26px;

  width:calc(100% + 52px);
  height:calc(100% + 52px);

  pointer-events:none;
  overflow:visible;
}

.member-tag{
  position:absolute;

  top:26px;
  left:26px;

  background:#D4AF37;
  color:white;

  font-family:var(--font-accent);
  font-weight:700;
  font-size:14px;
  letter-spacing:2px;

  padding:9px 16px;

  z-index:5;

  box-shadow:0 6px 14px rgba(148,1,15,.35);
}

/* =========================================================
   QUOTE
   ========================================================= */

.quote-zone{
  position:relative;
  z-index:3;

  margin:48px auto 0;

  width:880px;
}

.quote-card{
  position:relative;

  background:white;

  border:1px solid var(--line);
  border-left:6px solid var(--red);
  border-radius:4px;

  padding:42px 52px 36px 60px;

  box-shadow:0 10px 30px -14px rgba(10,12,40,.18);
}

.quote-mark{
  position:absolute;

  top:-8px;
  left:16px;

  font-family:Georgia,'Times New Roman',serif;
  font-size:110px;
  line-height:1;

  color:var(--blue);
  opacity:.16;

  user-select:none;
}

#memberQuoteEl{
  font-family:var(--font-body);
  font-style:italic;
  font-weight:600;

  font-size:31px;
  line-height:1.42;

  color:var(--ink);
}

.quote-attribution{
  display:flex;
  align-items:center;
  justify-content:flex-end;

  gap:10px;
  margin-top:24px;
}

.quote-attribution .rule{
  width:30px;
  height:2px;

  background:var(--blue);
  opacity:.7;
}

.quote-attribution span{
  font-family:var(--font-accent);
  font-weight:700;

  font-size:16px;
  letter-spacing:1px;

  color:var(--blue);
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer{
  position:relative;
  z-index:3;

  margin-top:auto;

  background:var(--blue);

  padding:36px 90px 56px;
}

.footer::before{
  content:"";

  position:absolute;
  top:0;
  left:0;
  right:0;

  height:5px;

  background:var(--red);
}

.footer-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.footer-col{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.footer-col.right{
  text-align:right;
  align-items:flex-end;
}

.footer-eyebrow{
  font-family:var(--font-accent);
  font-weight:600;

  font-size:12px;
  letter-spacing:3px;

  color:rgba(255,255,255,.55);

  text-transform:uppercase;
}

.footer-value{
  font-family:var(--font-accent);
  font-weight:700;

  font-size:24px;
  letter-spacing:.5px;

  color:white;
}

.footer-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.footer-tagline{
  font-family:var(--font-body);
  font-weight:700;

  font-size:14px;
  letter-spacing:2px;

  color:white;
  text-transform:uppercase;

.change-member-button{
  position:fixed;
  left:20px;
  top:50%;
  transform:translateY(-50%);

  border:none;
  border-radius:6px;
  padding:13px 16px;

  font-weight:700;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}

.change-member-button:hover{
  background:var(--red);
}

@media (max-width:1200px){
  .change-member-button{
    left:8px;
    padding:11px 12px;
    font-size:11px;
  }
}

</style>
</head>

<script>

/* =========================================================
   SETTINGS
   ========================================================= */

const GITHUB_IMAGE_BASE =
  "https://raw.githubusercontent.com/nepaldallasfootballclub/2026-27-Gold-Member-FAC/main/member-images/";

const GITHUB_QUOTE_BASE =
  "https://raw.githubusercontent.com/nepaldallasfootballclub/2026-27-Gold-Member-FAC/main/member-quotes/";

const GITHUB_LOGO_URL =
  "https://raw.githubusercontent.com/nepaldallasfootballclub/NDFC-Strava-Stats/main/NDFC_Official_Logo.png";

const IMAGE_EXTENSIONS = [".jpg", ".jpeg", ".png"];


/* =========================================================
   ELEMENTS / STATE
   ========================================================= */

let currentMemberName = "";

const setupScreen =
  document.getElementById("setupScreen");

const memberInput =
  document.getElementById("memberInput");

const generateButton =
  document.getElementById("generateButton");

const changeMemberButton =
  document.getElementById("changeMemberButton");

const errorMessage =
  document.getElementById("errorMessage");

const folderStatus =
  document.getElementById("folderStatus");

const canvas =
  document.getElementById("canvas");


/* =========================================================
   NORMALIZE MEMBER NAME
   ========================================================= */

function nameToFileBase(name){
  return name
    .trim()
    .replace(/\s+/g, "_")
    .replace(/[^\w\-]/g, "");
}


/* =========================================================
   GITHUB HELPERS
   ========================================================= */

function githubFileURL(baseURL, filename){
  return baseURL + encodeURIComponent(filename);
}

async function findGithubImage(baseName){

  for(const extension of IMAGE_EXTENSIONS){

    const filename = baseName + extension;
    const url = githubFileURL(GITHUB_IMAGE_BASE, filename);

    try{
      const response = await fetch(url, {
        method:"HEAD",
        cache:"no-store"
      });

      if(response.ok){
        return url;
      }
    }catch(error){
      // Try the next extension.
    }
  }

  return null;
}

async function fetchGithubQuote(baseName){

  const url =
    githubFileURL(
      GITHUB_QUOTE_BASE,
      baseName + ".txt"
    );

  const response = await fetch(url, {
    cache:"no-store"
  });

  if(!response.ok){
    return null;
  }

  const text = await response.text();

  return text
    .split(/\r?\n/)
    .map(line => line.trim())
    .find(line => line.length > 0) || null;
}


/* =========================================================
   INITIAL LOGO
   ========================================================= */

document.querySelectorAll("img.logo, img.setup-logo").forEach(img => {
  img.src = GITHUB_LOGO_URL;
});


/* =========================================================
   LOAD MEMBER
   ========================================================= */

generateButton.addEventListener("click", loadMember);

memberInput.addEventListener("keydown", event => {
  if(event.key === "Enter"){
    loadMember();
  }
});

changeMemberButton.addEventListener("click", () => {
  setupScreen.style.display = "flex";
  errorMessage.style.display = "none";
  memberInput.focus();
  memberInput.select();
});


async function loadMember(){

  clearError();

  const memberName =
    memberInput.value.trim();

  if(!memberName){
    showError("Please enter a member name.");
    return;
  }

  const baseName =
    nameToFileBase(memberName);

  if(!baseName){
    showError("Please enter a valid member name.");
    return;
  }

  generateButton.disabled = true;
  generateButton.textContent = "LOADING...";
  folderStatus.textContent = "Fetching photo and quote from GitHub...";
  folderStatus.style.color = "#777";

  try{

    const [imageURL, quote] =
      await Promise.all([
        findGithubImage(baseName),
        fetchGithubQuote(baseName)
      ]);

    if(!imageURL){
      throw new Error(
        `No GitHub image found for "${memberName}". Expected ${baseName}.jpg, ${baseName}.jpeg, or ${baseName}.png`
      );
    }

    if(!quote){
      throw new Error(
        `No GitHub quote found for "${memberName}". Expected ${baseName}.txt`
      );
    }

    currentMemberName = memberName;

    applyMemberData({
      memberName:memberName,
      memberPhoto:imageURL,
      memberQuote:quote,
      photoPosition:"center 40%",
      designation:"Gold",
      season:"2026/27",
      tagline:"Home Away From Home"
    });

    canvas.style.display = "flex";
    setupScreen.style.display = "none";

    renderFlyer();

  }catch(error){

    console.error(error);
    showError(error.message || "Something went wrong while loading this member.");

  }finally{

    generateButton.disabled = false;
    generateButton.textContent = "LOAD MEMBER";

    if(currentMemberName){
      folderStatus.textContent =
        `Loaded: ${currentMemberName}`;
      folderStatus.style.color = "#16833a";
    }else{
      folderStatus.textContent = "";
    }
  }
}


/* =========================================================
   APPLY MEMBER DATA
   ========================================================= */

function applyMemberData(data){

  const nameEl =
    document.getElementById(
      "memberNameEl"
    );

  const quoteEl =
    document.getElementById(
      "memberQuoteEl"
    );


  nameEl.innerHTML =
    splitNameForColor(
      data.memberName
    );


  quoteEl.textContent =
    "\u201C" +
    data.memberQuote +
    "\u201D";


  document.getElementById(
    "designationEl"
  ).textContent =
    data.designation;


  document.getElementById(
    "seasonEl"
  ).textContent =
    data.season;


  document.getElementById(
    "taglineEl"
  ).textContent =
    data.tagline;


  const img =
    document.getElementById(
      "memberPhotoEl"
    );


  img.src =
    data.memberPhoto;


  img.style.objectPosition =
    data.photoPosition ||
    "center 20%";

}


/* =========================================================
   SPLIT NAME COLORS
   ========================================================= */

function splitNameForColor(name){

  const parts =
    name.trim().split(/\s+/);


  if(parts.length === 1){

    return name.toUpperCase();

  }


  const first =
    parts[0];

  const rest =
    parts.slice(1).join(" ");


  return (
    first.toUpperCase() +
    ' <span class="accent">' +
    rest.toUpperCase() +
    "</span>"
  );

}


/* =========================================================
   AUTO FIT NAME
   ========================================================= */

function autoFitSingleLine(
  el,
  maxWidth,
  minSize,
  maxSize
){

  let size =
    maxSize;


  el.style.fontSize =
    size + "px";


  while(
    el.scrollWidth > maxWidth &&
    size > minSize
  ){

    size -= 2;

    el.style.fontSize =
      size + "px";

  }

}


/* =========================================================
   AUTO FIT QUOTE
   ========================================================= */

function autoFitQuote(
  el,
  maxHeight,
  minSize,
  maxSize
){

  let size =
    maxSize;


  el.style.fontSize =
    size + "px";


  while(
    el.scrollHeight > maxHeight &&
    size > minSize
  ){

    size -= 1;

    el.style.fontSize =
      size + "px";

  }

}


/* =========================================================
   RENDER
   ========================================================= */

function renderFlyer(){

  const nameEl =
    document.getElementById(
      "memberNameEl"
    );


  autoFitSingleLine(
    nameEl,
    952,
    46,
    108
  );


  const quoteEl =
    document.getElementById(
      "memberQuoteEl"
    );


  autoFitQuote(
    quoteEl,
    280,
    20,
    31
  );

}


/* =========================================================
   ERROR HANDLING
   ========================================================= */

function showError(message){

  errorMessage.innerHTML =
    message;

  errorMessage.style.display =
    "block";

}


function clearError(){

  errorMessage.innerHTML =
    "";

  errorMessage.style.display =
    "none";

}

</script>
